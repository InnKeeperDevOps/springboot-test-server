# kaiad.yaml — build pipeline + deployment metadata for this service.
# kaiad reads this on every push to the watched branch (main), runs
# the build steps inside the named image, captures /artifacts, and
# pushes a runtime image to kaiad's built-in OCI registry as
#   <kaiad-host>/springboot-test-server:<git-sha>
#   <kaiad-host>/springboot-test-server:latest
#
# `instances`, `domains`, and `environments` are deployment-time
# metadata that downstream operators consume — they do not change the
# image. Top-level fields are the defaults; an environment override
# overlays just the fields it sets.

version: 1

build:
  # Maven + JDK 17, matches the project's pom.xml parent.
  image: maven:3-eclipse-temurin-17
  steps:
    # -B (batch mode) keeps the log clean; -DskipTests because tests
    # run separately. The compiled jar lands in target/.
    - mvn package -DskipTests -B
    # Glob the produced jar into /artifacts where kaiad collects it.
    - cp target/demo-*.jar /artifacts/app.jar

artifacts:
  - app.jar

runtime:
  # Slim JRE-only base. The whole maven build chain stays out of the
  # runtime image.
  image: eclipse-temurin:17-jre
  copy:
    - from: app.jar
      to: /app.jar
  command: ["java", "-jar", "/app.jar"]

ports:
  # Spring Boot is configured with server.port=8093 in
  # src/main/resources/application.properties — declare it here so
  # kaiad can wire up Service objects / probes / panel display
  # without poking at the runtime image.
  - port: 8093
    name: http

# ── Deployment ────────────────────────────────────────────────────
# Top-level defaults. An environment override that omits a field
# falls back to these.
instances: 1
domains: []

environments:
  # Always-on dev sandbox. Single replica, dev DNS.
  development:
    instances: 1
    domains:
      - host: springboot.dev.kaiad.dev
        port: 8093
        protocol: https

  # Staging — run two for upgrade-safety smoke testing.
  staging:
    instances: 2
    domains:
      - host: springboot.staging.kaiad.dev
        port: 8093
        protocol: https

  # Production — three replicas; both apex and a www subdomain.
  production:
    instances: 3
    domains:
      - host: springboot.kaiad.dev
        port: 8093
        protocol: https
      - host: www.springboot.kaiad.dev
        port: 8093
        protocol: https
